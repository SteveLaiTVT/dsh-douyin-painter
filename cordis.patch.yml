# Install this local package into a Harness profile, then include its bundle.
# The module repeats inject so service dependencies are also enforced in code.
- insert:
    - id: douyin-painter
      name: dsh-douyin-painter
      inject:
        - agents
        - sessions
        - sessionPersistence
      config:
        port: 3210
        textMode: harness
        provider: deepseek-official
        model: deepseek-flash
